name: Make Snapshot
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
on:
  workflow_run:
    workflows: [macOS]
    types: [completed]
    branches: [develop]

# The artifact only runs on the same distro upon which it was built.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
    - name: 'Download artifacts'
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs');
          const headSha = context.payload.workflow_run.head_sha;

          // Download macOS artifact from the triggering workflow run
          let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
          });
          let matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
            return artifact.name == "megaglest-x64-macos"
          })[0];
          let download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: matchArtifact.id,
              archive_format: 'zip',
          });
          fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/megaglest-x64-macos.zip`, Buffer.from(download.data));

          // Find the Windows workflow run for the same commit SHA
          const windowsRuns = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: headSha,
              status: 'success',
              per_page: 20,
          });
          const windowsRun = windowsRuns.data.workflow_runs.find(r => r.name === 'Windows');
          if (!windowsRun) {
              core.setFailed(`No successful Windows workflow run found for SHA ${headSha}`);
              return;
          }

          allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: windowsRun.id,
          });
          matchArtifact = allArtifacts.data.artifacts.filter((artifact) => {
            return artifact.name == "megaglest-x64-windows-archive"
          })[0];
          download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: matchArtifact.id,
              archive_format: 'zip',
          });
          fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/megaglest-x64-windows-archive.zip`, Buffer.from(download.data));

    - name: 'Prepare artifacts'
      run: |
        unzip megaglest-x64-windows-archive.zip
        unzip megaglest-x64-macos.zip
        rm megaglest-x64-windows-archive.zip megaglest-x64-macos.zip

    - name: 'Prerelease'
      uses: ncipollo/release-action@v1
      with:
        artifacts: "*.zip,*.tar.bz2"
        body: "MegaGlest Snapshot Release"
        allowUpdates: true
        prerelease: true
        removeArtifacts: false
        replacesArtifacts: true
        omitBodyDuringUpdate: true
        omitNameDuringUpdate: true
        tag: snapshot


  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
    - run: |
        echo 'The triggering workflow failed'
        exit 1
