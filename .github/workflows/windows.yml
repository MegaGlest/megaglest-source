name: Windows
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [ develop ]
    paths: &windows_paths
      - '**'
      - '!**.md'
      - '!**.yml'
      - '.github/workflows/windows.yml'

  pull_request:
    branches: [ develop ]
    paths: *windows_paths

jobs:
  build-win64-deps:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
        build_type: [Release]
        include:
          - build_type: Release
            release: 'ON'
    # Pinned to windows-2022 because windows-latest has migrated to a 2025 image
    # with VS 2026 pre-installed, but the build script asks cmake for the
    # "Visual Studio 17 2022" generator and cmake can't find a VS 17 install.
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v7

    - name: Cache Vcpkg Libs
      id: cache-vcpkg
      uses: actions/cache@v5
      env:
        cache-name: cache-vcpkg-deps
      with:
        path: c:/vcpkg/installed
        # Key includes the runner image (toolchain ABI) and a content hash of
        # the install script (the dependency manifest), so the cache is
        # invalidated automatically when either changes. restore-keys allows
        # graceful partial-hit fallback when only the package list changes.
        key: vcpkg-deps-windows-2022-${{ hashFiles('mk/windoze/install-deps-vcpkg.ps1') }}
        restore-keys: |
          vcpkg-deps-windows-2022-

    - name: Install Windows Deps
      if: steps.cache-vcpkg.outputs.cache-hit != 'true'
      run: |
        cd mk\windoze
        $scriptDir = Get-Location
        cd c:\vcpkg
        & "$(Join-Path $scriptDir install-deps-vcpkg.ps1)"

  build-win64:
    needs: build-win64-deps
    strategy:
      fail-fast: false
      matrix:
        arch: [x64]
        build_type: [Release]
        include:
          - build_type: Release
            release: 'ON'
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v7

    - name: Get Vcpkg Libs Cache
      uses: actions/cache@v5
      env:
        cache-name: cache-vcpkg-deps
      with:
        path: c:/vcpkg/installed
        # Must match the key/restore-keys used in build-win64-deps so we
        # restore the libs built there.
        key: vcpkg-deps-windows-2022-${{ hashFiles('mk/windoze/install-deps-vcpkg.ps1') }}
        restore-keys: |
          vcpkg-deps-windows-2022-

    - name: Build MegaGlest
      run: |
        cd mk/windoze
        ./build-mg-vs-cmake.ps1 -vcpkg-location c:/vcpkg/

    - name: Git Hash
      run: echo "VERSION=$(git rev-parse --short HEAD)" >> $env:GITHUB_ENV

    - name: Prepare Snapshot
      run: |
        cd mk\windoze
        Get-ChildItem *.exe | Rename-Item -NewName {$_.BaseName + "-$env:VERSION" + $_.Extension}
        cp ..\shared\*.ini .
        $7zPath = $(Get-Command 7z).Source
        cp $7zPath .
        Remove-Item glest-dev.ini
        Compress-Archive -Path *.exe,*.ini -DestinationPath megaglest-x64-windows.zip
        cd ../..

    - name: Create MegaGlest Snapshot
      uses: actions/upload-artifact@v7
      with:
        name: megaglest-x64-windows-archive
        retention-days: 1
        path: mk/windoze/*.zip
