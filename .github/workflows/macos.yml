name: macOS
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [ develop ]
    paths: &macos_paths
      - '**'
      - '!**.md'
      - '!**.yml'
      - '.github/workflows/macos.yml'

  pull_request:
    branches: [ develop ]
    paths: *macos_paths

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      SNAPSHOT_ARCH: arm64
    steps:
    - uses: actions/checkout@v6
    - name: Cache Homebrew packages
      uses: actions/cache@v5
      with:
        path: ~/Library/Caches/Homebrew
        key: ${{ matrix.os }}-brew-${{ hashFiles('.github/workflows/macos.yml') }}
        restore-keys: ${{ matrix.os }}-brew-

    - name: Get dependencies
      run: |
        mk/macos/setupBuildDeps.sh

    - name: Build MegaGlest With Clang Compiler
      run: |
        mk/macos/build-mg.sh -m
        make -C mk/macos/build -j$(sysctl -n hw.ncpu) VERBOSE=1

    - name: Run tests
      run: ctest --test-dir mk/macos/build --output-on-failure

    - name: Git Hash
      if: ${{ github.ref == 'refs/heads/develop' }}
      run: |
        echo "VERSION=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Prepare Snapshot
      if: ${{ github.ref == 'refs/heads/develop' && matrix.os == 'macos-latest' }}
      run: |
        cd mk/macos
        ./make-binary-archive.sh
        cd -
        mv release/mg-binary-macos*.tar.bz2 release/megaglest-${SNAPSHOT_ARCH}-macos.tar.bz2

    - name: Create MegaGlest Snapshot
      if: ${{ github.ref == 'refs/heads/develop' && matrix.os == 'macos-latest' }}
      uses: actions/upload-artifact@v7
      with:
        name: megaglest-${{ env.SNAPSHOT_ARCH }}-macos
        retention-days: 1
        path: release/*.tar.bz2
