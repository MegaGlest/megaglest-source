name: Meson
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  push:
    branches: [ develop ]
    paths:
    - 'source/**/**'
    - '**meson.build'
    - '**/meson.yml'
  pull_request:
    branches: [ develop ]
    paths:
    - 'source/**/**'
    - '**meson.build'
    - '**/meson.yml'

jobs:
  meson:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Get dependencies
      run: |
        sudo mk/linux/setupBuildDeps.sh
        sudo apt install -y meson
        # Using pip is only required if a newer version of meson is required
        # sudo apt-get install -y python3-pip python3-setuptools # required for pip
        # sudo -H python3 -m pip install meson ninja
    - name: Build
      run:  |
        mk/linux/test-meson-build.sh

  freebsd:
    runs-on: ubuntu-latest
    name: FreeBSD
    steps:
    - uses: actions/checkout@v4
    - name: Test in FreeBSD
      id: test
      uses: vmactions/freebsd-vm@v1
      with:
        usesh: true
        prepare: |
          pkg install -y \
              bash \
              meson \
              cmake \
              cppunit \
              curl \
              freetype2 \
              fribidi \
              ftgl \
              git \
              glew \
              jpeg-turbo \
              libGLU \
              libircclient \
              libogg \
              libvorbis \
              libX11 \
              libxml2 \
              lua53 \
              mesa-libs \
              miniupnpc \
              openal-soft \
              pkgconf \
              png \
              sdl2 \
              wx30-gtk3

        run: |
          git config --global --add safe.directory /home/runner/work/megaglest-source/megaglest-source
          mk/linux/test-meson-build.sh
